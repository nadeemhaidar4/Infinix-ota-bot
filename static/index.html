<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Who is the Spy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1DA1F2;
            --dark-blue: #0E4B82;
            --btn-blue: #2CA5F5;
            --btn-orange: #FFA92B;
            --card-blue: #0D82D6;
            --bg-color: #1760A5;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, #1E88E5, #1565C0);
            font-family: 'Nunito', sans-serif;
            color: var(--text-light);
            margin: 0; padding: 0;
            height: 100dvh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }

        /* --- Header/Logo --- */
        .logo-container {
            background: linear-gradient(180deg, #37A8E6 0%, #1579BE 100%);
            border: 3px solid #67C7FF;
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.3);
            margin-bottom: 20px;
            position: relative;
        }
        .logo-text {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 2px 2px 0 #0D47A1, -1px -1px 0 #64B5F6, 1px -1px 0 #64B5F6, -1px 1px 0 #0D47A1, 1px 1px 0 #0D47A1;
            line-height: 1;
        }
        .logo-spy { color: #FF9800; text-shadow: 2px 2px 0 #E65100, -1px -1px 0 #FFE082, 1px -1px 0 #FFE082, -1px 1px 0 #E65100, 1px 1px 0 #E65100; }

        /* --- Main Container --- */
        .main-container {
            width: 100%; max-width: 400px;
            height: 100%;
            display: flex; flex-direction: column;
            padding: 1rem; box-sizing: border-box;
        }

        /* --- Buttons & Inputs --- */
        .game-btn {
            width: 100%;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .game-btn:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4); }
        
        .btn-yellow { background: linear-gradient(180deg, #FFD54F 0%, #FFA000 100%); }
        .btn-cyan { background: linear-gradient(180deg, #4FC3F7 0%, #0288D1 100%); }
        .btn-blue { background: linear-gradient(180deg, #29B6F6 0%, #0277BD 100%); font-size: 1rem; padding: 10px; }
        .btn-red { background: linear-gradient(180deg, #EF5350 0%, #C62828 100%); font-size: 0.9rem; padding: 6px 12px; }
        
        .input-box {
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #64B5F6;
            background: rgba(255,255,255,0.9); color: #000; font-weight: 700; font-size: 1.1rem;
            text-align: center; box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
            user-select: auto; -webkit-user-select: auto; margin-bottom: 10px; outline: none;
        }
        .input-box:focus { border-color: #FF9800; }

        /* --- Game Board & Players --- */
        .board-container {
            background: var(--bg-color);
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 16px; position: relative;
        }
        .header-bar {
            background: linear-gradient(180deg, #4FC3F7 0%, #0288D1 100%);
            padding: 10px 15px; border-radius: 12px; border: 2px solid #B3E5FC;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin-bottom: 15px; z-index: 2;
        }
        .header-title { font-weight: 800; font-size: 1.1rem; text-shadow: 1px 1px 1px rgba(0,0,0,0.5); }
        
        .players-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
            padding: 10px; flex: 1; overflow-y: auto; z-index: 1;
        }
        
        .player-card {
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .player-avatar-wrapper {
            width: 70px; height: 70px; border-radius: 50%; padding: 4px;
            background: linear-gradient(180deg, #E0E0E0 0%, #9E9E9E 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; display: flex; justify-content: center; align-items: center;
        }
        .player-avatar-wrapper.active { background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%); border: 2px solid #81C784;}
        .player-avatar-wrapper.dead { background: linear-gradient(180deg, #ef5350 0%, #c62828 100%); opacity: 0.6; filter: grayscale(100%);}
        .player-avatar-wrapper.speaking { animation: pulse 1s infinite alternate; background: linear-gradient(180deg, #FFC107 0%, #FF9800 100%); border: 3px solid #FFF;}
        
        @keyframes pulse { from { transform: scale(1); box-shadow: 0 0 5px #FF9800; } to { transform: scale(1.1); box-shadow: 0 0 15px #FFC107; } }

        .player-initial { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #FFF; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .player-name { margin-top: 5px; font-weight: 700; font-size: 0.9rem; text-align: center; color: #FFF; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .mic-badge {
            position: absolute; bottom: -5px; right: -5px; width: 24px; height: 24px; border-radius: 50%;
            background: #444; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
        .mic-badge.on { background: #4CAF50; }
        .mic-badge.off { background: #F44336; }
        
        .number-badge {
            position: absolute; top: -5px; left: -5px; width: 20px; height: 20px; border-radius: 50%;
            background: #2196F3; border: 1.5px solid #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: white;
        }

        /* --- Middle Action Area --- */
        .action-area { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 10px 0; z-index: 2; }

        /* --- Chat Box --- */
        .chat-container {
            background: rgba(13, 71, 161, 0.6); border-radius: 12px;
            display: flex; flex-direction: column; flex: 0.6; min-height: 120px; border: 1px solid rgba(255,255,255,0.1);
        }
        #messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 0 0 12px 12px; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 20px; border: none; background: rgba(255,255,255,0.9); font-family: 'Nunito', sans-serif; font-weight: 600; outline: none;}
        .chat-icon-btn { width: 36px; height: 36px; border-radius: 50%; background: #4FC3F7; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: white; font-size: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}

        /* --- Bottom Bar --- */
        .bottom-bar { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
        .bottom-icon { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: background 0.2s;}
        .bottom-icon.active { background: #4CAF50; color: white; box-shadow: 0 0 10px #4CAF50; }
        .bottom-icon.inactive { background: #F44336; color: white; }
        
        .secret-word-box { background: rgba(0, 0, 0, 0.4); border: 2px dashed #4FC3F7; border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 10px; }

        #vote-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-radius: 16px;
        }

        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- JOIN SCREEN -->
        <div id="join-section" class="flex flex-col h-full justify-center">
            
            <div class="flex justify-center w-full mb-8">
                <div class="logo-container text-center">
                    <div class="logo-text">WHO<br>IS THE <span class="logo-spy">SPY</span></div>
                </div>
            </div>
            
            <div class="bg-[rgba(255,255,255,0.1)] p-5 rounded-2xl border border-[rgba(255,255,255,0.2)] mb-6">
                <input type="text" id="username" placeholder="Enter Player Name" class="input-box">
                <select id="capacity-select" class="input-box" style="margin-bottom:0;">
                    <option value="4">4 Players Mode</option>
                    <option value="6">6 Players Mode</option>
                </select>
            </div>

            <div class="flex gap-3 mb-6">
                <button onclick="joinRoom('random')" class="game-btn btn-yellow flex-1" style="flex-direction: column; gap: 2px;">
                    <span style="font-size: 1.5rem;">🔍</span>
                    <span style="font-size: 0.9rem;">Auto Match</span>
                </button>
                <button onclick="joinRoom('create')" class="game-btn btn-cyan flex-1" style="flex-direction: column; gap: 2px;">
                    <span style="font-size: 1.5rem;">🏠</span>
                    <span style="font-size: 0.9rem;">Create Room</span>
                </button>
            </div>
            <button onclick="joinRoom('join')" class="game-btn btn-blue">Join with Code</button>
            
            <div class="mt-8 text-center bg-[rgba(0,0,0,0.3)] rounded-full py-2 px-4 inline-block self-center border border-[rgba(255,255,255,0.1)]">
                <span class="text-sm font-bold text-gray-300">👥 Players Online: <span id="active-users-count" class="text-green-400">0</span></span>
            </div>
            
            <p id="join-loading" class="text-yellow-400 font-bold text-center mt-4 hidden animate-pulse"></p>
        </div>


        <!-- GAME SCREEN -->
        <div id="game-section" class="hidden h-full flex-col">
            
            <div class="board-container">
                <!-- Top Header -->
                <div class="header-bar">
                    <div class="flex flex-col">
                        <span class="header-title">Room: <span id="room-name-display">----</span></span>
                        <span id="game-status-text" class="text-xs text-blue-100 font-bold">Waiting...</span>
                    </div>
                    <button onclick="leaveGame()" class="game-btn btn-red" style="width: auto;">Leave</button>
                </div>

                <!-- Secret Word -->
                <div id="secret-word-banner" class="hidden secret-word-box mx-4">
                    <div class="text-xs text-blue-200 uppercase font-bold tracking-widest">Your Secret Word</div>
                    <div id="my-word" class="text-2xl font-black text-white tracking-wider mt-1" style="font-family: 'Fredoka One', cursive;">WAITING</div>
                </div>

                <!-- Players Grid -->
                <div class="players-grid" id="players-grid-container">
                    <!-- Players dynamically added here -->
                </div>

                <!-- Timer Area -->
                <div class="action-area" id="action-area">
                    <div id="turn-timer-container" class="hidden w-full px-4">
                        <div class="flex justify-between items-center mb-1">
                            <span id="turn-countdown" class="font-bold text-yellow-400 text-xs">Your Turn: 30s</span>
                            <button onclick="endMyTurn()" class="bg-blue-600 px-3 py-1 rounded-full text-[10px] font-bold shadow border border-blue-400 uppercase">Pass Mic</button>
                        </div>
                        <div class="w-full bg-[rgba(0,0,0,0.5)] h-2 rounded-full overflow-hidden">
                            <div id="turn-progress-bar" class="bg-green-400 h-full w-full transition-all duration-1000 linear"></div>
                        </div>
                    </div>
                    <div id="game-alert-box" class="bg-[rgba(0,0,0,0.6)] px-4 py-1.5 rounded-full text-xs font-bold text-center border border-[rgba(255,255,255,0.1)] mx-4">
                        Waiting for players...
                    </div>
                </div>

                <!-- Chat Box -->
                <div class="chat-container mx-4 mb-2">
                    <div id="messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button onclick="sendChat()" class="chat-icon-btn">➤</button>
                    </div>
                </div>
                
                <!-- Bottom Action Bar -->
                <div class="bottom-bar mx-4">
                    <div id="bottom-mic-btn" class="bottom-icon inactive" onclick="toggleMic()">🎤</div>
                    <div class="bottom-icon" style="opacity: 0.5;">💬</div>
                </div>

                <!-- Voting Overlay -->
                <div id="vote-overlay" class="hidden">
                    <h2 class="text-2xl font-black text-red-500 mb-6" style="font-family: 'Fredoka One', cursive;">Who's the Spy?</h2>
                    <div id="vote-buttons" class="grid grid-cols-2 gap-4 w-full max-w-xs"></div>
                </div>

            </div>
        </div>
    </div>
    
    <!-- Audio Elements -->
    <audio id="sfx-click" src="https://actions.google.com/sounds/v1/ui/button_click.ogg" preload="auto"></audio>
    <audio id="sfx-start" src="https://actions.google.com/sounds/v1/science_fiction/computer_beeps.ogg" preload="auto"></audio>
    <audio id="sfx-turn" src="https://actions.google.com/sounds/v1/communication/walkie_talkie_squelch.ogg" preload="auto"></audio>
    <audio id="sfx-timeout" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
    <audio id="sfx-spy-caught" src="https://actions.google.com/sounds/v1/crowds/crowd_cheering.ogg" preload="auto"></audio>
    <audio id="sfx-civ-dead" src="https://actions.google.com/sounds/v1/alarms/radiation_meter_fast.ogg" preload="auto"></audio>
    <audio id="sfx-game-over" src="https://actions.google.com/sounds/v1/science_fiction/power_down.ogg" preload="auto"></audio>

    <script src="/static/script.js"></script>
</body>
</html>
