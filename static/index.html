<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Word Game - Suspense Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <!-- Google Fonts for Gaming Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spy-red: #ff3366;
            --civ-blue: #00d2ff;
            --neon-green: #39ff14;
        }

        body {
            /* Colorful vibrant animated gradient background */
            background: linear-gradient(-45deg, #1a0b2e, #0b1d3a, #1f0b1a, #0b2b1a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container with colorful borders */
        .glass-panel {
            background: rgba(20, 25, 40, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 2px solid var(--civ-blue);
            border-bottom: 2px solid var(--spy-red);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 210, 255, 0.2);
            border-radius: 20px;
        }

        .title-text {
            font-family: 'Bangers', cursive;
            background: linear-gradient(to right, var(--spy-red), #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }

        /* Character Avatars (CSS Art) */
        .character-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
            background: rgba(0,0,0,0.5);
            border: 3px solid;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        .avatar.civ {
            border-color: var(--civ-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        
        .avatar.civ::after {
            content: "👨‍🚀"; 
        }

        .avatar.spy {
            border-color: var(--spy-red);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        .avatar.spy::after {
            content: "🥷"; 
        }

        /* Inputs & Buttons */
        .neo-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }

        .neo-input:focus {
            border-color: var(--civ-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .btn-action {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, #ff3366, #ff9933);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 51, 0.6);
        }
        
        .btn-blue {
            background: linear-gradient(45deg, #0052D4, #4364F7, #6FB1FC);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        /* Top Secret Header */
        .secret-header {
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 51, 102, 0.1),
                rgba(255, 51, 102, 0.1) 10px,
                rgba(0, 0, 0, 0.3) 10px,
                rgba(0, 0, 0, 0.3) 20px
            );
            border: 1px dashed var(--spy-red);
        }

        /* The Word */
        #my-word {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        /* Chat Window */
        .chat-container {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-header {
            background: #2a2a35;
            padding: 5px 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            gap: 6px;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yel { background: #ffbd2e; }
        .dot-grn { background: #27c93f; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--civ-blue); border-radius: 10px; }
        
        /* Voting Area */
        #vote-area {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--spy-red);
            box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.2);
        }
        
        .vote-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            transition: 0.2s;
        }
        .vote-btn:hover {
            border-color: var(--spy-red);
            background: rgba(255, 51, 102, 0.2);
            color: var(--spy-red);
        }

    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Background decorative elements -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, #ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>

    <div class="w-full max-w-md glass-panel p-6 relative z-10">
        
        <!-- Animated Title -->
        <h1 class="text-5xl text-center mb-2 title-text">SPY WORD</h1>
        <p class="text-center text-gray-300 text-sm mb-6 tracking-widest font-semibold uppercase">Suspense Mode</p>
        
        <!-- Join Section -->
        <div id="join-section" class="space-y-4">
            <!-- Visual Character Representations -->
            <div class="character-container">
                <div class="avatar civ" title="Civilian"></div>
                <div class="text-2xl font-bold text-gray-400 mt-6">VS</div>
                <div class="avatar spy" title="Spy"></div>
            </div>
            <p class="text-center text-sm text-gray-400 mb-2">Identify the Spy or Survive!</p>

            <input type="text" id="username" placeholder="ENTER CODENAME (Name)" class="w-full p-3 rounded neo-input text-lg font-bold outline-none text-center uppercase">
            <input type="text" id="room" placeholder="ROOM ID (e.g. 1234)" class="w-full p-3 rounded neo-input text-lg font-bold outline-none text-center uppercase tracking-widest">
            <button onclick="joinRoom()" class="w-full btn-action text-white p-4 rounded-lg font-bold text-xl uppercase tracking-widest mt-2">Enter Lobby</button>
        </div>

        <!-- Game Section -->
        <div id="game-section" class="hidden mt-2">
            
            <!-- Header (Word & Mic) -->
            <div class="flex justify-between items-center mb-4 p-4 rounded-xl secret-header relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs text-gray-300 uppercase tracking-widest mb-1 font-bold">Classified Word</p>
                    <p id="my-word" class="text-3xl font-bold">???</p>
                </div>
                <div id="mic-status" class="bg-red-500/80 border border-red-500 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-[0_0_10px_rgba(255,0,0,0.5)]">
                    <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                    <span id="mic-text">MIC OFF</span>
                </div>
            </div>

            <div class="bg-gray-900/60 rounded-lg p-2 mb-4 border border-gray-700">
                <p id="game-alert" class="text-yellow-400 font-bold text-center text-lg animate-pulse">Waiting for squad (0/4)...</p>
            </div>

            <!-- Turn Controls -->
            <div id="turn-controls" class="hidden mb-4">
                <button onclick="endMyTurn()" class="w-full btn-blue text-white p-3 rounded-lg font-bold text-lg uppercase tracking-wider animate-bounce">Pass Comm (End Turn)</button>
            </div>

            <!-- Voting Area -->
            <div id="vote-area" class="hidden mb-4 p-5 rounded-xl text-center">
                <p class="text-red-500 font-bold text-xl mb-4 tracking-wider" style="font-family: 'Orbitron', sans-serif;">TARGET LOCK: CAST VOTE</p>
                <div id="vote-buttons" class="grid grid-cols-2 gap-3"></div>
            </div>

            <!-- Terminal Chat -->
            <div class="chat-container mb-4">
                <div class="chat-header">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yel"></div>
                    <div class="dot dot-grn"></div>
                    <span class="text-gray-400 text-xs ml-2 font-mono">comm_link_secure</span>
                </div>
                <div id="messages" class="h-40 overflow-y-auto p-3 text-left text-md flex flex-col gap-2 font-semibold"></div>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Transmit message..." class="flex-1 p-3 rounded-lg neo-input outline-none">
                <button onclick="sendChat()" class="bg-blue-600 hover:bg-blue-500 px-6 rounded-lg font-bold uppercase transition-colors shadow-[0_0_10px_rgba(0,100,255,0.3)]">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        const originalSetMicState = window.setMicState;
        if(typeof window.setMicState === 'undefined') {
            window.addEventListener('load', () => {
                const micDiv = document.getElementById('mic-status');
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if(mutation.type === 'childList') {
                           if(micDiv.innerText === "MIC ON") {
                               micDiv.innerHTML = '<div class="w-2 h-2 rounded-full bg-white animate-pulse"></div><span>MIC ON</span>';
                           } else if (micDiv.innerText === "MIC OFF") {
                               micDiv.innerHTML = '<div class="w-2 h-2 rounded-full bg-white"></div><span>MIC OFF</span>';
                           }
                        }
                    });
                });
                observer.observe(micDiv, { childList: true });
            });
        }
    </script>
</body>
</html>
