<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spy Word Game - Suspense Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spy-red: #ff3366;
            --civ-blue: #00d2ff;
            --neon-green: #39ff14;
        }

        body {
            background: linear-gradient(-45deg, #1a0b2e, #0b1d3a, #1f0b1a, #0b2b1a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            
            /* Strictly prevent background scrolling */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            
            /* Disable Text Copy & Selection for Mobile */
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            -khtml-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(20, 25, 40, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 2px solid var(--civ-blue);
            border-bottom: 2px solid var(--spy-red);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            
            /* Setup for internal dynamic height fitting */
            max-height: 96dvh;
            display: flex;
            flex-direction: column;
        }

        .title-text {
            font-family: 'Bangers', cursive;
            background: linear-gradient(to right, var(--spy-red), #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }

        .character-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            position: relative;
            background: rgba(0,0,0,0.5);
            border: 3px solid;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }

        .avatar.civ { border-color: var(--civ-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }
        .avatar.civ::after { content: "👨‍🚀"; }
        .avatar.spy { border-color: var(--spy-red); box-shadow: 0 0 15px rgba(255, 51, 102, 0.5); }
        .avatar.spy::after { content: "🥷"; }

        /* Enable Text Selection Only Inside Input Fields */
        .neo-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
            -webkit-user-select: auto;
            user-select: auto;
        }

        .neo-input:focus {
            border-color: var(--civ-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        /* Button Styles */
        .btn-action {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, #ff3366, #ff9933);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }
        
        .btn-blue {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, #0052D4, #4364F7, #6FB1FC);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            border: none;
        }

        .btn-dark {
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #666;
        }

        .secret-header {
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 51, 102, 0.1),
                rgba(255, 51, 102, 0.1) 10px,
                rgba(0, 0, 0, 0.3) 10px,
                rgba(0, 0, 0, 0.3) 20px
            );
            border: 1px dashed var(--spy-red);
        }

        #my-word {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .chat-container {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-header {
            background: #2a2a35;
            padding: 5px 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            gap: 6px;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yel { background: #ffbd2e; }
        .dot-grn { background: #27c93f; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--civ-blue); border-radius: 10px; }
        
        #vote-area {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--spy-red);
            box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- Active Users Badge -->
    <div class="fixed top-3 right-3 bg-gray-900/80 border border-green-500/50 px-3 py-1 rounded-full text-xs font-bold text-green-400 flex items-center gap-2 shadow-[0_0_10px_rgba(0,255,0,0.2)] z-50">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        ACTIVE AGENTS: <span id="active-users-count">0</span>
    </div>

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, #ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>

    <div class="w-full max-w-md glass-panel p-4 sm:p-6 relative z-10 w-full h-full">
        
        <h1 class="text-4xl sm:text-5xl text-center mb-1 title-text shrink-0">SPY WORD</h1>
        <p class="text-center text-gray-300 text-xs sm:text-sm mb-4 tracking-widest font-semibold uppercase shrink-0">Suspense Mode</p>
        
        <!-- Join Section with New Button Flow -->
        <div id="join-section" class="flex flex-col flex-1 min-h-0 justify-center space-y-3 overflow-y-auto">
            <div class="character-container shrink-0">
                <div class="avatar civ" title="Civilian"></div>
                <div class="text-xl font-bold text-gray-400 mt-5">VS</div>
                <div class="avatar spy" title="Spy"></div>
            </div>
            <p class="text-center text-xs sm:text-sm text-gray-400 mb-2 shrink-0">Identify the Spy or Survive!</p>

            <!-- Player Name Update -->
            <input type="text" id="username" placeholder="PLAYER NAME" class="w-full p-3 rounded neo-input text-lg font-bold outline-none text-center uppercase mb-2 shrink-0">
            
            <button onclick="joinRoom('random')" class="w-full btn-action text-white p-3 rounded-lg font-bold text-md sm:text-lg uppercase tracking-widest shrink-0">Enter Lobby</button>
            <button onclick="joinRoom('create')" class="w-full btn-blue text-white p-3 rounded-lg font-bold text-md sm:text-lg uppercase tracking-widest shrink-0">Create Room</button>
            <button onclick="joinRoom('join')" class="w-full btn-dark text-white p-3 rounded-lg font-bold text-md sm:text-lg uppercase tracking-widest shrink-0">Join Room</button>
        </div>

        <!-- Game Section (Flex container to fill space) -->
        <div id="game-section" class="hidden mt-2 flex-col flex-1 min-h-0 w-full">
            
            <div class="flex justify-between items-center mb-3 p-3 rounded-xl secret-header relative overflow-hidden shrink-0">
                <div class="relative z-10">
                    <p class="text-[10px] sm:text-xs text-gray-300 uppercase tracking-widest mb-1 font-bold">Classified Word <span id="current-room-display" class="ml-1 text-yellow-400 font-mono"></span></p>
                    <p id="my-word" class="text-2xl sm:text-3xl font-bold">???</p>
                </div>
                <!-- Mic Default UI is ON -->
                <div id="mic-status" class="bg-green-500/80 border border-green-500 px-3 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-2 shadow-[0_0_10px_rgba(0,255,0,0.5)]">
                    <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                    <span id="mic-text">MIC ON</span>
                </div>
            </div>

            <div class="bg-gray-900/60 rounded-lg p-2 mb-3 border border-gray-700 shrink-0">
                <p id="game-alert" class="text-yellow-400 font-bold text-center text-md sm:text-lg animate-pulse">Waiting for squad (0/4)...</p>
            </div>

            <div id="turn-controls" class="hidden mb-3 shrink-0">
                <button onclick="endMyTurn()" class="w-full btn-blue text-white p-3 rounded-lg font-bold text-md uppercase tracking-wider animate-bounce">Pass Comm (End Turn)</button>
            </div>

            <div id="vote-area" class="hidden mb-3 p-4 rounded-xl text-center shrink-0">
                <p class="text-red-500 font-bold text-lg mb-3 tracking-wider" style="font-family: 'Orbitron', sans-serif;">TARGET LOCK: CAST VOTE</p>
                <div id="vote-buttons" class="grid grid-cols-2 gap-2"></div>
            </div>

            <!-- Terminal Chat (Takes remaining space automatically) -->
            <div class="chat-container flex flex-col flex-1 min-h-0 mb-3">
                <div class="chat-header shrink-0">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yel"></div>
                    <div class="dot dot-grn"></div>
                    <span class="text-gray-400 text-[10px] ml-2 font-mono">comm_link_secure</span>
                </div>
                <!-- Messages area is scrollable -->
                <div id="messages" class="flex-1 overflow-y-auto p-3 text-left text-sm flex flex-col gap-2 font-semibold"></div>
            </div>
            
            <div class="flex gap-2 shrink-0">
                <input type="text" id="chat-input" placeholder="Transmit message..." class="flex-1 p-2 sm:p-3 rounded-lg neo-input outline-none text-sm">
                <button onclick="sendChat()" class="bg-blue-600 hover:bg-blue-500 px-4 sm:px-6 rounded-lg font-bold uppercase transition-colors shadow-[0_0_10px_rgba(0,100,255,0.3)] text-sm">Send</button>
            </div>
        </div>
    </div>

    <!-- Script to change flex class instead of block -->
    <script>
        // Override the UI change in script.js to ensure flexbox works
        const originalJoinRoom = window.joinRoom;
        if(typeof window.joinRoom === 'undefined') {
            window.addEventListener('load', () => {
                const observer = new MutationObserver(() => {
                    const gameSec = document.getElementById("game-section");
                    if(gameSec && !gameSec.classList.contains("hidden")) {
                        gameSec.classList.add("flex");
                    }
                });
                observer.observe(document.getElementById("game-section"), { attributes: true, attributeFilter: ['class'] });
            });
        }
    </script>
    <script src="/static/script.js"></script>
    <script>
        window.addEventListener('load', () => {
            const micDiv = document.getElementById('mic-status');
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if(mutation.type === 'childList') {
                       if(micDiv.innerText === "MIC ON") {
                           micDiv.innerHTML = '<div class="w-2 h-2 rounded-full bg-white animate-pulse"></div><span>MIC ON</span>';
                       } else if (micDiv.innerText === "MIC OFF") {
                           micDiv.innerHTML = '<div class="w-2 h-2 rounded-full bg-white"></div><span>MIC OFF</span>';
                       }
                    }
                });
            });
            if(micDiv) observer.observe(micDiv, { childList: true });
        });
    </script>
</body>
</html>
