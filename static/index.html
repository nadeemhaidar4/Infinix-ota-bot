<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spy Word Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <!-- Simple, Clean, Readable Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --spy-red: #ff3b30;
            --civ-blue: #0a84ff;
            --neon-green: #30d158;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
        }
        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif; 
            color: #ffffff; 
            margin: 0; padding: 0;
            height: 100dvh; width: 100vw; overflow: hidden;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; 
        }
        
        .glass-panel {
            background: var(--panel-bg); 
            border-top: 3px solid var(--civ-blue); border-bottom: 3px solid var(--spy-red);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); border-radius: 16px;
            max-height: 96dvh; display: flex; flex-direction: column;
        }
        
        .title-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .title-spy { color: var(--spy-red); }

        .avatar {
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; background: #2c2c2c; border: 3px solid; transition: transform 0.2s;
        }
        .avatar.civ { border-color: var(--civ-blue); }
        .avatar.civ::after { content: "🕵️‍♂️"; }
        .avatar.spy { border-color: var(--spy-red); }
        .avatar.spy::after { content: "🥷"; }
        
        .neo-input {
            background: #2c2c2c; border: 1px solid #444; color: #fff;
            font-family: 'Inter', sans-serif; font-weight: 600; transition: all 0.2s; user-select: auto; -webkit-user-select: auto;
        }
        .neo-input:focus { border-color: var(--civ-blue); outline: none;}
        
        .btn {
            font-family: 'Poppins', sans-serif; font-weight: 700; border: none; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-action { background: var(--spy-red); color: white; }
        .btn-blue { background: var(--civ-blue); color: white;}
        .btn-dark { background: #333; border: 1px solid #555; color: white;}
        .btn-exit { background: transparent; color: #ff453a; border: 1px solid #ff453a; }

        .secret-header { background: #2c2c2c; border: 1px solid #444; }
        #my-word { font-family: 'Poppins', sans-serif; color: var(--neon-green); font-weight: 900;}
        
        .chat-container { background: #000; border: 1px solid #333; border-radius: 8px; }
        .chat-header { background: #222; padding: 6px 10px; border-radius: 8px 8px 0 0; display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; } .dot-red { background: #ff5f56; } .dot-yel { background: #ffbd2e; } .dot-grn { background: #27c93f; }
        
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        
        #vote-area { background: #2c1a1a; border: 1px solid var(--spy-red); }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-4 pt-12 relative">

    <div class="absolute top-3 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-green-500 px-4 py-2 rounded-full text-xs sm:text-sm font-bold text-green-400 flex items-center gap-2 z-50 shadow-md">
        <div class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div>
        PLAYERS ONLINE: <span id="active-users-count">0</span>
    </div>

    <div class="w-full max-w-md glass-panel p-4 sm:p-6 relative z-10 w-full h-full mt-2">
        
        <h1 class="text-4xl sm:text-5xl text-center mb-1 title-text shrink-0">WORD <span class="title-spy">SPY</span></h1>
        <p class="text-center text-gray-400 text-xs sm:text-sm mb-5 font-semibold uppercase shrink-0">Find the Imposter</p>
        
        <div id="join-section" class="flex flex-col flex-1 min-h-0 justify-center space-y-3 overflow-y-auto">
            <div class="flex justify-center gap-6 mb-4 shrink-0">
                <div class="avatar civ" title="Civilian"></div>
                <div class="text-2xl font-black text-gray-500 mt-4">VS</div>
                <div class="avatar spy" title="Spy"></div>
            </div>

            <input type="text" id="username" placeholder="Enter Player Name" class="w-full p-3.5 rounded-lg neo-input text-lg text-center mb-1 shrink-0">
            
            <select id="capacity-select" class="w-full p-3.5 rounded-lg neo-input text-md text-center shrink-0">
                <option value="4">4 Players Mode</option>
                <option value="6">6 Players Mode</option>
            </select>
            
            <button onclick="playSound('click'); joinRoom('random')" class="btn btn-action w-full p-3.5 rounded-lg text-md uppercase tracking-wider shrink-0 mt-3">Play Now (Auto Match)</button>
            <button onclick="playSound('click'); joinRoom('create')" class="btn btn-blue w-full p-3.5 rounded-lg text-md uppercase tracking-wider shrink-0">Create Private Room</button>
            <button onclick="playSound('click'); joinRoom('join')" class="btn btn-dark w-full p-3.5 rounded-lg text-md uppercase tracking-wider shrink-0">Join with Code</button>
        </div>

        <div id="game-section" class="hidden mt-1 flex-col flex-1 min-h-0 w-full">
            
            <div class="flex justify-between items-center mb-3 p-3.5 rounded-xl secret-header relative shrink-0">
                <div>
                    <p class="text-[10px] sm:text-xs text-gray-400 uppercase font-bold mb-1">Your Secret Word <span id="current-room-display" class="ml-1 text-yellow-500"></span></p>
                    <p id="my-word" class="text-2xl font-black">WAITING...</p>
                </div>
                
                <div class="flex flex-col gap-2 items-end">
                    <div id="mic-status" onclick="playSound('click'); toggleMic()" class="cursor-pointer bg-green-600 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                        <span id="mic-text">MIC ON</span>
                    </div>
                    <button onclick="playSound('click'); leaveGame()" class="btn-exit px-3 py-1 rounded-lg text-[10px] font-bold">LEAVE</button>
                </div>
            </div>

            <div class="bg-gray-800 rounded-lg p-2.5 mb-3 border border-gray-700 shrink-0">
                <p id="game-alert" class="text-yellow-400 font-bold text-center text-sm">Waiting for other players...</p>
            </div>

            <div id="turn-timer-container" class="hidden mb-3 shrink-0">
                <div class="w-full bg-gray-700 rounded-full h-3 relative overflow-hidden">
                    <div id="turn-progress-bar" class="bg-yellow-400 h-full w-full transition-all duration-1000 ease-linear"></div>
                </div>
                <p id="turn-countdown" class="text-center text-yellow-400 font-bold mt-1.5 text-xs">YOUR TURN: 15s</p>
            </div>

            <div id="vote-area" class="hidden mb-3 p-4 rounded-xl text-center shrink-0">
                <p class="text-red-500 font-bold text-md mb-3 uppercase">Who is the Spy? Vote Now!</p>
                <div id="vote-buttons" class="grid grid-cols-2 gap-2"></div>
            </div>

            <div class="chat-container flex flex-col flex-1 min-h-0 mb-3">
                <div class="chat-header shrink-0">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yel"></div>
                    <div class="dot dot-grn"></div>
                </div>
                <div id="messages" class="flex-1 overflow-y-auto p-3 text-left text-sm flex flex-col gap-1.5 font-medium"></div>
            </div>
            
            <div class="flex gap-2 shrink-0">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 p-3 rounded-lg neo-input text-sm">
                <button onclick="playSound('click'); sendChat()" class="btn btn-blue px-5 rounded-lg text-sm">SEND</button>
            </div>
        </div>
    </div>
    
    <!-- Audio Elements for Sound Effects -->
    <audio id="sfx-click" src="https://actions.google.com/sounds/v1/ui/button_click.ogg"></audio>
    <audio id="sfx-start" src="https://actions.google.com/sounds/v1/science_fiction/computer_beeps.ogg"></audio>
    <audio id="sfx-turn" src="https://actions.google.com/sounds/v1/ui/pop_up_sound.ogg"></audio>
    <audio id="sfx-timeout" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <audio id="sfx-spy-caught" src="https://actions.google.com/sounds/v1/crowds/crowd_cheering.ogg"></audio>
    <audio id="sfx-civ-dead" src="https://actions.google.com/sounds/v1/alarms/radiation_meter_fast.ogg"></audio>
    <audio id="sfx-game-over" src="https://actions.google.com/sounds/v1/science_fiction/power_down.ogg"></audio>

    <script src="/static/script.js"></script>
</body>
</html>
